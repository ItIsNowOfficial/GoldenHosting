<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Golden Hosting</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="slip-stage">
  <div class="slip" style="max-width:500px;">
    <div class="slip-head">
      <a href="index.html" class="brand-lockup">
        <img src="assets/mark_gold.png" alt="" class="brand-mark" />
        <span class="wordmark">Golden <em>Hosting</em></span>
      </a>
      <span class="slip-num">CONTROL CENTER</span>
    </div>
    <div class="slip-body">
      <span class="eyebrow">Dashboard</span>
      <h1>Your bots, at a glance.</h1>
      <p class="desc" style="margin-bottom:1.2rem;">Deploy, monitor and manage every bot slot on your plan from here.</p>

      <div id="userDisplay" class="readout"><span class="dot"></span> reading session…</div>

      <div class="action-row">
        <a href="deploy.html" class="btn btn-primary">Deploy bot <span class="arrow">→</span></a>
        <a href="support.html" class="btn btn-line">Support</a>
      </div>
    </div>
    <div class="slip-foot">
      <a href="index.html" class="back-link"><span class="arrow">←</span> back to home</a>
      <span class="owned-by">Owned by ItIsNow</span>
    </div>
  </div>
</div>

<script>
  const session = localStorage.getItem('goldenSession');
  const userDisplay = document.getElementById('userDisplay');
  if (session) {
    try {
      const data = JSON.parse(session);
      userDisplay.innerHTML = '<span class="dot"></span> SESSION — ' + data.name + ' · ' + data.email;
    } catch (e) {
      userDisplay.innerHTML = '<span class="dot"></span> SESSION — welcome back';
    }
  } else {
    userDisplay.classList.add('warn');
    userDisplay.innerHTML = '<span class="dot"></span> NOT SIGNED IN — <a href="login.html">log in</a>';
  }
</script>
</body>
</html>
