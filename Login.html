<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Golden Hosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..600;1,14..32,400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0b10;
      background-image: radial-gradient(circle at 15% 20%, #1f1a24 0%, #0a080e 90%);
      font-family: 'Inter', sans-serif;
      color: #eae6f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 15, 24, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 3rem;
      padding: 2.8rem 2.5rem 2.5rem;
      border: 1px solid rgba(255, 215, 0, 0.12);
      box-shadow: 0 25px 50px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255, 215, 0, 0.05);
    }
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .auth-logo img {
      height: 64px;
      width: auto;
      filter: drop-shadow(0 0 12px rgba(245, 184, 27, 0.25));
      background: rgba(0,0,0,0.2);
      padding: 6px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255, 215, 0, 0.08);
      margin-bottom: 0.5rem;
    }
    .auth-logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f9d976 0%, #e6a800 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .auth-logo h1 i { color: #f5b81b; font-size: 1.4rem; }
    .auth-logo span {
      font-weight: 400;
      color: #9a8aa8;
      font-size: 0.75rem;
      background: rgba(255, 215, 0, 0.06);
      padding: 0.15rem 0.9rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 215, 0, 0.08);
      margin-top: -2px;
    }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #b3a3c0;
      margin-bottom: 0.3rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #2f2838;
      background: #12101a;
      color: #f0eae6;
      font-size: 0.95rem;
      transition: 0.2s;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .form-group input:focus { border-color: #f5b81b; box-shadow: 0 0 0 3px rgba(245, 184, 27, 0.12); }
    .form-group input::placeholder { color: #5d4f68; }
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -0.2rem;
      margin-bottom: 1.8rem;
    }
    .form-row a {
      color: #f5b81b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .form-row a:hover { text-decoration: underline; color: #fad05a; }
    .btn-gold {
      width: 100%;
      background: linear-gradient(145deg, #f5c542, #d99f10);
      border: none;
      color: #0d0b10;
      font-weight: 700;
      padding: 0.85rem;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(245, 184, 27, 0.25);
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .btn-gold:hover { transform: scale(1.01); background: linear-gradient(145deg, #fcd15a, #e6ad1a); box-shadow: 0 8px 24px rgba(245, 184, 27, 0.4); }
    .auth-message {
      margin-top: 1.2rem;
      padding: 0.7rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
      background: rgba(245, 184, 27, 0.06);
      border: 1px solid rgba(245, 184, 27, 0.08);
    }
    .auth-message.show { display: block; }
    .auth-message.error { color: #f87171; border-color: rgba(248, 113, 113, 0.2); background: rgba(248, 113, 113, 0.05); }
    .auth-message.success { color: #a3e635; border-color: rgba(163, 230, 53, 0.15); background: rgba(163, 230, 53, 0.04); }
    .auth-footer {
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.85rem;
      color: #7a6a88;
      border-top: 1px solid rgba(255, 215, 0, 0.04);
      padding-top: 1.4rem;
    }
    .auth-footer a { color: #f5b81b; text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .back-home {
      display: inline-block;
      margin-top: 0.8rem;
      color: #9a8aa8;
      text-decoration: none;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .back-home:hover { color: #f5b81b; }
    .back-home i { margin-right: 4px; }
    @media (max-width: 480px) { .auth-container { padding: 2rem 1.5rem; border-radius: 2rem; } }
  </style>
</head>
<body>

<div class="auth-container">
  <a href="index.html" class="auth-logo">
    <img src="logo.png" alt="Golden Hosting" onerror="this.style.display='none'" />
    <h1><i class="fas fa-crown"></i> Golden Hosting</h1>
    <span>discord · premium</span>
  </a>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="loginEmail"><i class="far fa-envelope" style="margin-right:6px;"></i> Username or Email</label>
      <input type="text" id="loginEmail" placeholder="Enter your username or email" required />
    </div>
    <div class="form-group">
      <label for="loginPassword"><i class="fas fa-lock" style="margin-right:6px;"></i> Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required />
    </div>
    <div class="form-row">
      <a href="#" id="forgotLink"><i class="fas fa-question-circle"></i> Forgot password?</a>
    </div>
    <button type="submit" class="btn-gold"><i class="fas fa-sign-in-alt"></i> Login</button>
    <div id="loginMessage" class="auth-message"></div>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Sign up</a>
    <br />
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> back to home</a>
  </div>
</div>

<script>
  (function() {
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMessage');

    function showMessage(el, text, type = '') {
      el.textContent = text;
      el.className = 'auth-message show ' + type;
    }

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        showMessage(loginMsg, '⚠️ Please fill in both fields.', 'error');
        return;
      }

      let users = JSON.parse(localStorage.getItem('goldenUsers') || '[]');
      const found = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
      if (found) {
        showMessage(loginMsg, '✅ Welcome back, ' + found.name + '! Redirecting…', 'success');
        localStorage.setItem('goldenSession', JSON.stringify({ email: found.email, name: found.name }));
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
      } else {
        const exists = users.some(u => u.email.toLowerCase() === email.toLowerCase());
        showMessage(loginMsg, exists ? '❌ Incorrect password.' : '❌ No account found. Please sign up.', 'error');
      }
    });

    document.getElementById('forgotLink').addEventListener('click', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) { showMessage(loginMsg, '📧 Please enter your email address first.', 'error'); return; }
      let users = JSON.parse(localStorage.getItem('goldenUsers') || '[]');
      const found = users.find(u => u.email.toLowerCase() === email.toLowerCase());
      showMessage(loginMsg, found ? '🔑 Reset link sent to ' + email + ' (demo).' : '❌ No account found.', found ? 'success' : 'error');
    });
  })();
</script>
</body>
</html>
